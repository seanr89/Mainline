name: Automated Versioning & Changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer bump level (auto detects from Conventional Commits)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: 'Explicit version override (e.g. 1.2.0), optional'
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'chore(release):') &&
       !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump Version & Update Changelog
        id: bump
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.version }}" ]; then
              ARGS+=(--version "${{ inputs.version }}")
            elif [ -n "${{ inputs.bump }}" ] && [ "${{ inputs.bump }}" != "auto" ]; then
              ARGS+=(--bump "${{ inputs.bump }}")
            fi
          fi
          node scripts/bump-version.mjs "${ARGS[@]}"

      - name: Commit Version Bump & Push Tag
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "refs/tags/${{ steps.bump.outputs.tag }}"

  release:
    needs: version
    if: needs.version.outputs.bumped == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag_ref: ${{ needs.version.outputs.tag }}
    secrets: inherit
