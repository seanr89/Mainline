[package]
name = "git-workspace-manager"
version = "0.2.0"
description = "Mainline — High-performance macOS-style Git Workspace Manager"
authors = ["Mainline Engineering"]
edition = "2021"

[lib]
name = "git_workspace_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-store = "2.0"
tokio = { version = "1.38", features = ["process", "sync", "fs", "rt-multi-thread", "time", "macros"] }
walkdir = "2.5"
notify = "6.1"
notify-debouncer-mini = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
specta = { version = "=2.0.0-rc.20", features = ["derive"] }
specta-typescript = "=0.0.7"
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
